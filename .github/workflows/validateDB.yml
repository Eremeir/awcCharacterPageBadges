name: Validate Badge Database

on:
  push:
    paths:
      - "badges.jsonc"
      - "validateDB.js"

  pull_request:
    paths:
      - "badges.jsonc"
      - "validateDB.js"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate badges.jsonc
        run: node validateDB.js
