name: Validate & Publish Badge Database

on:
  push:
    branches:
      - master
    paths:
      - "badges.jsonc"
      - "scripts/buildJSON.js"

  pull_request:
    paths:
      - "badges.jsonc"
      - "scripts/validateDB.js"
      - "scripts/buildJSON.js"
      - ".github/workflows/validateDB.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate badges.jsonc
        run: node scripts/validateDB.js

      - name: Build badges.json
        run: node scripts/buildJSON.js

      - name: Create Pages directory
        run: |
          mkdir site
          cp badges.json site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v5
